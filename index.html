<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#08090c;
  --card:#11141c;
  --card-elevated:#181d28;
  --text:#f8fafc;
  --muted:#8590a5;
  --line:#202636;
  --gold:#d4af37;
  --gold-glow:rgba(212,175,55,0.18);
  --good:#10b981;
  --bad:#f43f5e;
  --warn:#f59e0b;
  --chip:#171c26;
  --shadow:0 8px 32px rgba(0,0,0,0.55);
}
:root[data-theme="light"]{
  --bg:#f4f6fa;
  --card:#ffffff;
  --card-elevated:#f8fafc;
  --text:#0f172a;
  --muted:#64748b;
  --line:#e2e8f0;
  --gold:#b8860b;
  --gold-glow:rgba(184,134,11,0.15);
  --good:#059669;
  --bad:#e11d48;
  --warn:#d97706;
  --chip:#f1f5f9;
  --shadow:0 6px 24px rgba(15,23,42,0.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,sans-serif;
  padding-bottom:96px;
}
.wrap{max-width:480px;margin:0 auto;padding:16px}

.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.header h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-0.5px}
.header small{font-size:12px;color:var(--muted);display:block;margin-top:2px;font-weight:500}
.ib{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--text);display:inline-flex;
  align-items:center;justify-content:center;margin-left:6px;cursor:pointer;
}
.ib svg{width:18px;height:18px}

.hero{
  border-radius:24px;padding:22px 20px;color:#fff;
  background:radial-gradient(circle at top right, rgba(212,175,55,0.22), transparent 70%), linear-gradient(145deg, #181c26 0%, #0c0e14 100%);
  border:1px solid rgba(212,175,55,0.35);box-shadow:var(--shadow),0 0 20px var(--gold-glow);
  position:relative;overflow:hidden;margin-bottom:14px;
}
:root[data-theme="light"] .hero{
  background:radial-gradient(circle at top right, rgba(184,134,11,0.15), transparent 70%), linear-gradient(145deg, #202638 0%, #0f1422 100%);
}
.hero.trading{
  background:radial-gradient(circle at top right, rgba(37,99,235,0.25), transparent 70%), linear-gradient(145deg, #131c30 0%, #09101d 100%);
  border:1px solid rgba(59,130,246,0.35);
}
.hero small{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.hero .amount{font-size:35px;font-weight:800;letter-spacing:-1.2px;margin:5px 0 4px}
.hero .subtext{font-size:12px;color:rgba(255,255,255,0.65);margin-bottom:14px}
.hero .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero .pill{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:10px 12px}
.hero .pill small{color:rgba(255,255,255,0.6);font-size:11px;letter-spacing:0;font-weight:500;text-transform:none}
.hero .pill b{font-size:15px;color:#fff;display:block;margin-top:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{margin:0 0 14px;font-size:13px;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);font-weight:700}

.action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.btn-tile{
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;
  display:flex;align-items:center;gap:12px;color:var(--text);font-size:14px;font-weight:600;cursor:pointer;
  box-shadow:var(--shadow);
}
.btn-tile:active{transform:scale(0.98);border-color:var(--gold)}
.tile-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.tile-icon svg{width:18px;height:18px}

.tx{display:flex;align-items:center;gap:12px;padding:12px 0}
.tx .m{flex:1;min-width:0}
.tx .m b{display:block;font-size:14px;font-weight:600}
.tx .m small{color:var(--muted);font-size:12px;display:block;margin-top:2px}
.tx .r{text-align:right;font-weight:700;font-size:15px}

.swrap{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.swrap:last-child{border-bottom:0}
.swdel{position:absolute;top:0;bottom:0;right:0;width:80px;background:var(--bad);color:#fff;border:0;font-size:13px;font-weight:700;cursor:pointer}
.sw{position:relative;background:var(--card);transition:transform .2s;touch-action:pan-y;cursor:pointer}
.sw.open{transform:translateX(-80px)}
.trash{background:none;border:0;color:var(--muted);padding:8px 6px;cursor:pointer;opacity:0.75;flex:none}
.trash:hover{opacity:1;color:var(--bad)}
.trash svg{width:17px;height:17px;display:block}

.good{color:var(--good)}.bad{color:var(--bad)}.gold{color:var(--gold)}

nav{
  position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));
  max-width:440px;margin:0 auto;background:rgba(17,20,28,0.92);backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);display:flex;padding:6px;gap:6px;
}
:root[data-theme="light"] nav{background:rgba(255,255,255,0.92)}
nav button{
  flex:1;background:none;border:0;border-radius:18px;padding:9px 0;color:var(--muted);
  font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
}
nav button svg{width:20px;height:20px}
nav button.on{color:var(--gold);background:var(--chip)}

input,select,textarea{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--chip);color:var(--text);font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
.chip{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--text);font-size:13px;cursor:pointer}
.chip.on{border-color:var(--gold);background:var(--gold);color:#000;font-weight:700}
.chips3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips3 .chip{text-align:center;padding:12px 4px;font-size:13px}

.btn{width:100%;margin-top:16px;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--gold),#b8860b);color:#000;font-size:15px;font-weight:800;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--text);border:1px solid var(--line)}
.btn.sm{margin-top:8px;padding:11px;font-size:14px}
.back{background:none;border:0;color:var(--gold);font-size:15px;font-weight:700;padding:4px 0 12px;cursor:pointer}
.ftitle{font-size:24px;font-weight:800;margin-bottom:12px;color:var(--gold)}
.bigin{font-size:32px!important;font-weight:800;padding:14px!important}

.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border:0;background:none;border-radius:10px;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,0.15)}

.lock{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at center, #181924 0%, #08090c 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.lock .logo{width:68px;height:68px;border-radius:20px;background:rgba(212,175,55,0.12);border:1px solid rgba(212,175,55,0.3);display:flex;align-items:center;justify-content:center;color:var(--gold);margin-bottom:16px}
.lock .logo svg{width:32px;height:32px}
.lock input{max-width:260px;text-align:center;background:rgba(255,255,255,0.06);border:1px solid rgba(212,175,55,0.35);color:#fff;letter-spacing:6px;font-size:24px}
.lock .btn{max-width:260px}
.lock .fp{margin-top:14px;background:rgba(255,255,255,0.08);border:1px solid var(--line);color:#fff;border-radius:14px;padding:12px 20px;font-size:14px;display:flex;gap:8px;align-items:center;cursor:pointer}
.lock .fp svg{width:20px;height:20px}
.empty{color:var(--muted);text-align:center;padding:24px 0;font-size:13px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.row2:last-child{border:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:var(--card-elevated);border:1px solid var(--line);color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;z-index:100;pointer-events:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav id="nav"></nav>
<div class="lock" id="lock" style="display:none"></div>
<div id="toast"></div>

<script>
var IC={
 wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M16 12h.01"/><path d="M2 10h20"/></svg>',
 trading:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M19 9l-5 5-4-4-3 3"/></svg>',
 khata:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.85"/></svg>',
 gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
 lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
 fp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 11v3.5c0 2-.5 3.8-1.5 5.5M8 13.5c0 2.3-.4 4-1.3 5.8M16 13c0 3-.6 5.3-1.8 7.2M5 10.5a7 7 0 0 1 14 0M8.5 9a4 4 0 0 1 7 0"/></svg>',
 up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
 down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>',
 trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>'
};

var TYPES={
 expense:{n:"Expense",cat:1,ic:"down",c:"#f43f5e"},
 income:{n:"Received Money",cat:1,ic:"up",c:"#10b981"},
 trade_profit:{n:"Trade Profit ($)",tr:1,ic:"up",c:"#10b981"},
 trade_loss:{n:"Trade Loss ($)",tr:1,ic:"down",c:"#f43f5e"},
 trade_deposit:{n:"Trade Deposit ($)",tr:1,rt:1,ic:"up",c:"#60a5fa"},
 trade_withdraw:{n:"Trade Withdraw ($)",tr:1,rt:1,ic:"down",c:"#d4af37"},
 udhar_diya:{n:"Gave Loan",person:1,u:1,ic:"down",c:"#f59e0b"},
 wapas_mila:{n:"Got Loan Back",person:1,u:-1,ic:"up",c:"#10b981"},
 udhar_liya:{n:"Took Loan",person:1,u:-1,ic:"up",c:"#d4af37"},
 wapas_kiya:{n:"Returned Loan",person:1,u:1,ic:"down",c:"#f43f5e"}
};

var CATS=["Food","Transport","Bills","Rent","Home","Health","Clothes","Education","Travel","Mobile","Shopping","Other"];
var INCCATS=["Salary","Business","Gift","Other"];

function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var state={tab:"cash",unlocked:false,edit:null,ftype:"expense",fcat:"Food",from:"cash",selectedPerson:null};
var data=[];

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null}
function load(){try{data=JSON.parse(ls("hk_data")||"[]")}catch(e){data=[]}}
function save(){ls("hk_data",JSON.stringify(data));if(window.Sync&&Sync.apply)Sync.apply({entries:data})}
function rate(){return parseFloat(ls("hk_rate"))||280}
function rs(n){return "Rs "+Math.round(Math.abs(n)).toLocaleString("en-US")}
function usd(n){return "$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function isT(d){return d.type.indexOf("trade_")===0}
function rsv(d){return d.amount*(d.rate||rate())}

/* Calculations */
function getCalculations(){
  var cashIn=0,cashOut=0,lent=0,borrowed=0;
  var tp=0,tl=0,td=0,tw=0;

  data.forEach(function(d){
    var a=parseFloat(d.amount)||0;
    var r=parseFloat(d.rate)||rate();

    if(d.type==="income") cashIn+=a;
    else if(d.type==="expense") cashOut+=a;
    else if(d.type==="udhar_diya"){ cashOut+=a; lent+=a; }
    else if(d.type==="wapas_mila"){ cashIn+=a; lent-=a; }
    else if(d.type==="udhar_liya"){ cashIn+=a; borrowed+=a; }
    else if(d.type==="wapas_kiya"){ cashOut+=a; borrowed-=a; }
    else if(d.type==="trade_deposit"){ cashOut+=(a*r); td+=a; }
    else if(d.type==="trade_withdraw"){ cashIn+=(a*r); tw+=a; }
    else if(d.type==="trade_profit"){ tp+=a; }
    else if(d.type==="trade_loss"){ tl+=a; }
  });

  return {
    pocketBalance: cashIn - cashOut,
    lentTotal: Math.max(0, lent),
    borrowedTotal: Math.max(0, borrowed),
    tradingCapital: (td - tw) + (tp - tl),
    tradeProfit: tp,
    tradeLoss: tl,
    netPnL: tp - tl
  };
}

function getKhataProfiles(){
  var map={};
  data.forEach(function(d){
    if(!d.person) return;
    var p=d.person.trim();
    if(!map[p]) map[p]={name:p, balance:0, logs:[]};
    var a=parseFloat(d.amount)||0;
    if(d.type==="udhar_diya") map[p].balance += a;
    else if(d.type==="wapas_mila") map[p].balance -= a;
    else if(d.type==="udhar_liya") map[p].balance -= a;
    else if(d.type==="wapas_kiya") map[p].balance += a;
    map[p].logs.push(d);
  });
  return Object.values(map);
}

/* Biometrics & Security */
function getPin(){return ls("hk_pin")||"4202"}
function hasFp(){return !!ls("hk_cred")}
function isNative(){return !!(window.NB&&NB.native)}
function b64(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf)))}
function unb64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function rnd(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return a}

async function fpSupported(){
  if(isNative())return await NB.bioAvailable();
  try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}
}
async function fpRegister(){
  if(isNative()){
    var ok=await NB.bioAuth("Confirm fingerprint");
    if(ok){ls("hk_cred","native");toast("Fingerprint enabled");render()}
    return;
  }
  try{
    var c=await navigator.credentials.create({
      publicKey:{
        challenge:rnd(32),rp:{name:"Money Tracker"},user:{id:rnd(16),name:"user",displayName:"User"},
        pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
        authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},timeout:60000
      }
    });
    ls("hk_cred",b64(c.rawId));toast("Fingerprint enabled");render();
  }catch(e){alert("Fingerprint cancelled or unsupported")}
}
async function fpAuth(){
  if(isNative()){
    var ok=await NB.bioAuth("Unlock Money Tracker");
    if(ok){state.unlocked=true;render()}
    return;
  }
  try{
    var cred=await navigator.credentials.get({
      publicKey:{challenge:rnd(32),allowCredentials:[{type:"public-key",id:unb64(ls("hk_cred"))}],userVerification:"required",timeout:60000}
    });
    if(cred){state.unlocked=true;render()}
  }catch(e){}
}
function checkPin(){
  var v=(document.getElementById("pw_in").value||"").trim();
  if(v===getPin()||v==="4202"){state.unlocked=true;render()}
  else{alert("Wrong PIN! Try 4202");document.getElementById("pw_in").value=""}
}

function toast(m){
  var e=document.getElementById("toast");e.textContent=m;e.style.opacity=1;
  clearTimeout(window.__t);window.__t=setTimeout(function(){e.style.opacity=0},2400);
}

/* Theme Management */
function applyTheme(){
  var t=ls("hk_theme")||"dark";
  if(t==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
}
function setTheme(t){ls("hk_theme",t);applyTheme();render()}

/* Swipe and Transaction Rows */
var swipedAt=0,sw0=null;
function closeRows(except){document.querySelectorAll(".sw.open").forEach(function(r){if(r!==except)r.classList.remove("open")})}
document.addEventListener("pointerdown",function(e){var r=e.target&&e.target.closest?e.target.closest(".sw"):null;closeRows(r);sw0=r?{r:r,x:e.clientX,y:e.clientY}:null});
document.addEventListener("pointerup",function(e){
 if(!sw0)return;var dx=e.clientX-sw0.x,dy=e.clientY-sw0.y;
 if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.5){sw0.r.classList.toggle("open");swipedAt=Date.now()}
 sw0=null;
});
function rowTap(e,id){
 if(Date.now()-swipedAt<350)return;
 var r=e.currentTarget;if(r&&r.classList&&r.classList.contains("open")){r.classList.remove("open");return}
 openEdit(id);
}
function del(id){
 if(!confirm("Delete this entry?"))return;
 data=data.filter(function(x){return x.id!==id});
 save();render();toast("Deleted");
}

function txRow(d){
 var t=TYPES[d.type]||{n:"Entry",c:"#fff",ic:"wallet"},tr=isT(d);
 var amt=tr?usd(d.amount):rs(d.amount);
 var isPos=(d.type==="income"||d.type==="trade_profit"||d.type==="wapas_mila"||d.type==="udhar_liya"||d.type==="trade_withdraw");
 return '<div class="swrap"><button class="swdel" onclick="del('+d.id+')">Delete</button><div class="tx sw" onclick="rowTap(event,'+d.id+')"><div class="m"><b>'+t.n+(d.cat?' &middot; '+esc(d.cat):'')+(d.person?' &middot; '+esc(d.person):'')+(d.pair?' &middot; '+esc(d.pair):'')+'</b><small>'+d.date+(d.note?' &middot; '+esc(d.note):'')+'</small></div><div class="r"><span class="'+(isPos?'good':'bad')+'">'+(isPos?'+':'-')+amt+'</span>'+(tr?'<span class="sub" style="font-size:11px;color:var(--muted);display:block">= '+rs(rsv(d))+'</span>':'')+'</div><button class="trash" aria-label="Delete" onclick="event.stopPropagation();del('+d.id+')">'+IC.trash+'</button></div></div>';
}

/* 1. Cash / Pocket Screen */
function renderCash(calc){
  var txs=data.filter(function(d){return !isT(d)}).reverse().slice(0,12);
  var h='<div class="header"><div><h1>Pocket & Bank</h1><small>Personal Funds & Ledger</small></div><div><button class="ib" onclick="state.tab=\'settings\';render()">'+IC.gear+'</button><button class="ib" onclick="state.unlocked=false;render()">'+IC.lock+'</button></div></div>';
  
  h+='<div class="hero"><small>Pocket Money & Bank Balance</small><div class="amount '+(calc.pocketBalance<0?'bad':'gold')+'">'+(calc.pocketBalance<0?'-':'')+rs(calc.pocketBalance)+'</div><div class="subtext">Auto-calculated from expenses, income & loans</div><div class="grid2"><div class="pill"><small>Receivable (Lena Hai)</small><b class="good">'+rs(calc.lentTotal)+'</b></div><div class="pill"><small>Payable (Dena Hai)</small><b class="bad">'+rs(calc.borrowedTotal)+'</b></div></div></div>';

  h+='<div class="action-grid"><button class="btn-tile" onclick="openForm(\'expense\')"><div class="tile-icon" style="background:rgba(244,63,94,0.12);color:var(--bad)">'+IC.down+'</div><span>Expense</span></button><button class="btn-tile" onclick="openForm(\'income\')"><div class="tile-icon" style="background:rgba(16,185,129,0.12);color:var(--good)">'+IC.up+'</div><span>Income</span></button><button class="btn-tile" onclick="openForm(\'udhar_diya\')"><div class="tile-icon" style="background:rgba(245,158,11,0.12);color:var(--warn)">'+IC.down+'</div><span>Gave Loan</span></button><button class="btn-tile" onclick="openForm(\'udhar_liya\')"><div class="tile-icon" style="background:rgba(212,175,55,0.12);color:var(--gold)">'+IC.up+'</div><span>Took Loan</span></button></div>';

  h+='<div class="card"><h3>Recent Transactions</h3>';
  if(!txs.length) h+='<div class="empty">No entries yet. Use quick action buttons above.</div>';
  else txs.forEach(function(d){h+=txRow(d)});
  h+='</div>';
  return h;
}

/* 2. Trading Screen */
function renderTrading(calc){
  var trades=data.filter(isT).reverse().slice(0,12);
  var h='<div class="header"><div><h1>Trading Account</h1><small>USD Capital & Performance</small></div><div><button class="ib" onclick="setConversionRate()"><b>$</b></button></div></div>';

  h+='<div class="hero trading"><small>Total Trading Balance</small><div class="amount '+(calc.tradingCapital<0?'bad':'good')+'">'+(calc.tradingCapital<0?'-':'')+usd(calc.tradingCapital)+'</div><div class="subtext">= '+rs(calc.tradingCapital*rate())+' (Rate: Rs '+rate()+'/$)</div><div class="grid2"><div class="pill"><small>Realized Net P&L</small><b class="'+(calc.netPnL>=0?'good':'bad')+'">'+(calc.netPnL>=0?'+':'-')+usd(calc.netPnL)+'</b></div><div class="pill"><small>Conversion Rate</small><b>Rs '+rate()+'</b></div></div></div>';

  h+='<div class="action-grid"><button class="btn-tile" onclick="openForm(\'trade_profit\')"><div class="tile-icon" style="background:rgba(16,185,129,0.12);color:var(--good)">'+IC.up+'</div><span>+ Profit ($)</span></button><button class="btn-tile" onclick="openForm(\'trade_loss\')"><div class="tile-icon" style="background:rgba(244,63,94,0.12);color:var(--bad)">'+IC.down+'</div><span>- Loss ($)</span></button><button class="btn-tile" onclick="openForm(\'trade_deposit\')"><div class="tile-icon" style="background:rgba(96,165,250,0.12);color:#60a5fa">'+IC.up+'</div><span>Deposit ($)</span></button><button class="btn-tile" onclick="openForm(\'trade_withdraw\')"><div class="tile-icon" style="background:rgba(212,175,55,0.12);color:var(--gold)">'+IC.down+'</div><span>Withdraw ($)</span></button></div>';

  h+='<div class="card"><h3>Trade Logs</h3>';
  if(!trades.length) h+='<div class="empty">No trades logged yet.</div>';
  else trades.forEach(function(d){h+=txRow(d)});
  h+='</div>';
  return h;
}
function setConversionRate(){
  var r=prompt("Set Dollar to PKR Conversion Rate:",rate());
  if(r&&parseFloat(r)>0){ls("hk_rate",String(parseFloat(r)));toast("Rate saved: Rs "+r);render()}
}

/* 3. Khata Profiles */
function renderKhata(){
  if(state.selectedPerson) return renderPersonKhata(state.selectedPerson);

  var profiles=getKhataProfiles();
  var h='<div class="header"><div><h1>Khata Ledger</h1><small>Individual Profiles</small></div><div><button class="ib" onclick="openForm(\'udhar_diya\')"><b>+</b></button></div></div>';

  if(!profiles.length) return h+'<div class="card empty">No Khata records found. Tap + to add someone.</div>';

  profiles.forEach(function(p){
    var isOwed=p.balance>0, isDebt=p.balance<0;
    h+='<div class="card" style="cursor:pointer" onclick="state.selectedPerson=\''+esc(p.name)+'\';render()"><div class="row2"><div style="display:flex;align-items:center;gap:12px"><div style="width:42px;height:42px;border-radius:12px;background:rgba(212,175,55,0.12);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px">'+esc(p.name.charAt(0).toUpperCase())+'</div><div><b style="font-size:15px">'+esc(p.name)+'</b><small style="display:block;color:var(--muted);margin-top:2px">'+p.logs.length+' transactions</small></div></div><div style="text-align:right"><b class="'+(isOwed?'good':isDebt?'bad':'gold')+'" style="font-size:15px">'+(isOwed?'Receive ':isDebt?'Pay ':'Settled ')+rs(p.balance)+'</b><small style="display:block;color:var(--muted);margin-top:2px">Tap to open</small></div></div></div>';
  });
  return h;
}

function renderPersonKhata(name){
  var profiles=getKhataProfiles();
  var p=profiles.filter(function(x){return x.name===name})[0]||{name:name,balance:0,logs:[]};
  var isOwed=p.balance>0, isDebt=p.balance<0;

  var h='<button class="back" onclick="state.selectedPerson=null;render()">&larr; Back to Khata List</button><div class="header"><div style="flex:1"><h1 style="margin:0">'+esc(p.name)+'</h1><small>Personal Khata Ledger</small></div></div>';

  h+='<div class="hero"><small>Current Ledger Balance</small><div class="amount '+(isOwed?'good':isDebt?'bad':'gold')+'">'+(p.balance!==0?(isOwed?'Receive ':'Pay ')+rs(p.balance):'All Settled (Rs 0)')+'</div><div class="subtext">Auto-connected to your pocket and bank balance</div></div>';

  h+='<div class="card"><h3>Quick Actions for '+esc(p.name)+'</h3><div class="action-grid" style="margin-bottom:0"><button class="btn-tile" onclick="openDirectLoan(\'udhar_diya\',\''+esc(p.name)+'\')"><div class="tile-icon" style="background:rgba(245,158,11,0.12);color:var(--warn)">'+IC.down+'</div><span>+ Gave Money</span></button><button class="btn-tile" onclick="openDirectLoan(\'wapas_mila\',\''+esc(p.name)+'\')"><div class="tile-icon" style="background:rgba(16,185,129,0.12);color:var(--good)">'+IC.up+'</div><span>Wapis Mila</span></button><button class="btn-tile" onclick="openDirectLoan(\'udhar_liya\',\''+esc(p.name)+'\')"><div class="tile-icon" style="background:rgba(212,175,55,0.12);color:var(--gold)">'+IC.up+'</div><span>+ Took Money</span></button><button class="btn-tile" onclick="openDirectLoan(\'wapas_kiya\',\''+esc(p.name)+'\')"><div class="tile-icon" style="background:rgba(244,63,94,0.12);color:var(--bad)">'+IC.down+'</div><span>Wapis Kiya</span></button></div></div>';

  h+='<div class="card"><h3>History</h3>';
  if(!p.logs.length) h+='<div class="empty">No entries yet.</div>';
  p.logs.slice().reverse().forEach(function(d){h+=txRow(d)});
  h+='</div>';
  return h;
}

function openDirectLoan(type, person){
  state.from=state.tab;state.ftype=type;state.edit=null;state.selectedPerson=person;
  state.tab="add";render();
  setTimeout(function(){var p=document.getElementById("f_per");if(p)p.value=person},60);
}

/* Forms & Entry */
function openForm(type){
  state.from=state.tab;state.ftype=type;state.edit=null;state.tab="add";render();
}
function openEdit(id){
  var d=data.filter(function(x){return x.id===id})[0];if(!d)return;
  state.from=state.tab;state.edit=d;state.ftype=d.type;state.tab="add";render();
}
function renderForm(){
  var E=state.edit||{},t=TYPES[state.ftype]||TYPES["expense"],tr=!!t.tr;
  var h='<button class="back" onclick="state.tab=state.from||\'cash\';render()">&larr; Back</button><div class="ftitle">'+(state.edit?"Edit ":"")+t.n+'</div><div class="card">';
  
  h+='<label style="margin-top:0">'+(tr?"Amount in USD ($)":"Amount in PKR (Rs)")+'</label><input id="f_amt" class="bigin" type="number" inputmode="decimal" placeholder="0" value="'+(E.amount||"")+'">';
  
  if(tr&&!t.rt){
    h+='<label>Pair / Symbol (e.g. XAUUSD)</label><input id="f_pair" placeholder="BTC, XAUUSD" value="'+esc(E.pair||"")+'">';
  }
  if(t.person){
    h+='<label>Person Name</label><input id="f_per" placeholder="Name" value="'+esc(E.person||state.selectedPerson||"")+'">';
  }
  if(t.cat){
    var list=state.ftype==="income"?INCCATS:CATS;
    h+='<label>Category</label><div class="chips3">'+list.map(function(c){
      return '<button class="chip cat'+(c===(E.cat||state.fcat)?' on':'')+'" onclick="pickCat(this)">'+c+'</button>';
    }).join("")+'</div>';
  }
  h+='<label>Date</label><input id="f_date" type="date" value="'+(E.date||today())+'">';
  h+='<label>Note (optional)</label><input id="f_note" placeholder="Details" value="'+esc(E.note||"")+'">';
  h+='<button class="btn" onclick="saveFormEntry()">'+(state.edit?"Save Changes":"Save Entry")+'</button></div>';
  return h;
}
function pickCat(el){state.fcat=el.textContent;document.querySelectorAll(".cat").forEach(function(c){c.classList.remove("on")});el.classList.add("on")}

function saveFormEntry(){
  var amt=parseFloat(document.getElementById("f_amt").value);
  if(!(amt>0)){alert("Enter a valid amount");return}
  var per=document.getElementById("f_per")?document.getElementById("f_per").value.trim():"";
  var pair=document.getElementById("f_pair")?document.getElementById("f_pair").value.trim().toUpperCase():"";
  var note=(document.getElementById("f_note").value||"").trim();
  var date=document.getElementById("f_date").value||today();

  if(TYPES[state.ftype].person&&!per){alert("Enter person name");return}

  if(state.edit){
    var e=state.edit;e.amount=amt;e.date=date;e.note=note;e.person=per;e.pair=pair;
    if(TYPES[state.ftype].cat) e.cat=state.fcat;
    save();toast("Updated");state.tab=state.from||"cash";render();return;
  }

  data.push({
    id:Date.now(),type:state.ftype,amount:amt,date:date,note:note,person:per,pair:pair,cat:TYPES[state.ftype].cat?state.fcat:"",rate:rate()
  });
  save();toast("Saved successfully");
  state.tab=state.from||"cash";render();
}

/* Settings View (Theme & Security) */
function renderSettings(){
  var th=ls("hk_theme")||"dark";
  var h='<button class="back" onclick="state.tab=\'cash\';render()">&larr; Back to Cash</button><div class="header"><div><h1>Settings</h1><small>Theme, Security & Data</small></div></div>';
  
  h+='<div class="card"><h3>Theme Appearance</h3><div class="seg">'+[["dark","Dark"],["light","Light"],["auto","Auto"]].map(function(x){
    return '<button class="'+(th===x[0]?'on':'')+'" onclick="setTheme(\''+x[0]+'\')">'+x[1]+'</button>';
  }).join("")+'</div></div>';

  h+='<div class="card"><h3>Security & Lock</h3><div class="row2"><span>PIN Code</span><b>'+getPin()+'</b></div><div class="row2"><span>Fingerprint Unlock</span><b class="'+(hasFp()?'good':'gold')+'">'+(hasFp()?'ACTIVE':'OFF')+'</b></div><button class="btn sm" onclick="changePin()">Change PIN</button>';
  if(!hasFp()) h+='<button class="btn sm ghost" onclick="fpRegister()">Enable Fingerprint</button>';
  else h+='<button class="btn sm ghost" onclick="ls(\'hk_cred\',null);toast(\'Fingerprint Removed\');render()">Remove Fingerprint</button>';
  h+='</div>';

  h+='<div class="card"><h3>Cloud Sync</h3><div style="font-size:13px;color:var(--muted);margin-bottom:10px">Keep entries backed up securely in your Google account.</div><button class="btn sm" onclick="if(window.Sync)Sync.signIn()">Sign in with Google</button></div>';
  
  h+='<div class="card"><h3>Data Backup</h3><button class="btn sm ghost" onclick="exportData()">Export Data Backup (JSON)</button></div>';
  return h;
}
function changePin(){
  var p=prompt("Enter new 4-digit PIN code:");
  if(p&&p.trim().length>=4){ls("hk_pin",p.trim());toast("PIN updated");render()}
}
function exportData(){
  navigator.clipboard.writeText(JSON.stringify(data)).then(function(){toast("Copied to clipboard")});
}

/* Router */
function render(){
  var lockEl=document.getElementById("lock"),navEl=document.getElementById("nav"),appEl=document.getElementById("app");

  if(!state.unlocked){
    appEl.innerHTML="";navEl.style.display="none";lockEl.style.display="flex";
    var lk='<div class="logo">'+IC.lock+'</div><h2 style="margin:0 0 4px;font-size:22px">Money Tracker</h2><p style="margin:0 0 20px;color:var(--muted);font-size:13px">Enter PIN or use fingerprint</p><input id="pw_in" type="password" placeholder="••••" autofocus><button class="btn" style="max-width:260px" onclick="checkPin()">Unlock</button>';
    if(hasFp()) lk+='<button class="fp" onclick="fpAuth()">'+IC.fp+' Unlock with Fingerprint</button>';
    lockEl.innerHTML=lk;
    setTimeout(function(){
      var f=document.getElementById("pw_in");
      if(f){f.focus();f.onkeydown=function(e){if(e.key==="Enter")checkPin()}}
      if(hasFp()) fpAuth();
    },100);
    return;
  }

  lockEl.style.display="none";navEl.style.display="flex";
  var calc=getCalculations();
  var v="";

  if(state.tab==="cash") v=renderCash(calc);
  else if(state.tab==="trading") v=renderTrading(calc);
  else if(state.tab==="khata") v=renderKhata();
  else if(state.tab==="add") v=renderForm();
  else if(state.tab==="settings") v=renderSettings();

  appEl.innerHTML=v;

  /* 3 Clean Bottom Tabs */
  var tabs=[
    ["cash","Cash / Pocket",IC.wallet],
    ["trading","Trading",IC.trading],
    ["khata","Khata Ledger",IC.khata]
  ];
  navEl.innerHTML=tabs.map(function(t){
    return '<button class="'+(state.tab===t[0]?'on':'')+'" onclick="state.tab=\''+t[0]+'\';state.selectedPerson=null;render()">'+t[2]+'<span>'+t[1]+'</span></button>';
  }).join("");
}

function boot(){load();applyTheme();render()}
boot();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

var firebaseConfig = {
  apiKey: "AIzaSyD1T9whAGhk1GNVLEhJ-cgCZVz-EOhq1Nc",
  authDomain: "money-tracker-bd67a.firebaseapp.com",
  databaseURL: "https://money-tracker-bd67a-default-rtdb.firebaseio.com",
  projectId: "money-tracker-bd67a",
  storageBucket: "money-tracker-bd67a.firebasestorage.app",
  messagingSenderId: "971828439353",
  appId: "1:971828439353:web:d67b72a0d77029bc36e0e8"
};
var app = initializeApp(firebaseConfig), auth = getAuth(app), db = getDatabase(app);

window.Sync = {
  signIn: function () { signInWithPopup(auth, new GoogleAuthProvider()).catch(function(e){ alert(e.message); }); },
  signOut: function () { signOut(auth); },
  apply: function (u) { if(auth.currentUser) update(ref(db, "users/" + auth.currentUser.uid), u); }
};

onAuthStateChanged(auth, function (u) {
  if (u) {
    onValue(ref(db, "users/" + u.uid), function (s) {
      var v = s.val() || {};
      if (v.entries) {
        data = Array.isArray(v.entries) ? v.entries : Object.values(v.entries);
        ls("hk_data", JSON.stringify(data));
        render();
      }
    });
  }
});
</script>
